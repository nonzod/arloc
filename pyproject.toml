[project]
name = "arloc"
version = "0.1.0"
description = "Composizione di foto di mosaici su sfondi"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6>=6.7",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "anthropic>=0.70",
    "keyring>=25",
    "platformdirs>=4",
    "httpx2>=2.16",
]

[project.scripts]
arloc = "arloc.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arloc"]
